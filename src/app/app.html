<app-controls
  (onOrdenarNombre)="ordenarPorNombre()"
  (onOrdenarId)="ordenarPorId()"
  (onInvertir)="invertir()">
</app-controls>

<header>
  <h1>Directorio ({{ totalUsers() }} usuarios)</h1>
</header>


<div class="users-grid">
  @for (user of users(); track user.id) {
    <app-user-card
      [user]="user"
      (eliminar)="eliminarUsuario($event)">
    </app-user-card>
  } @empty {
    <p>No hay usuarios en el directorio.</p>
  }
</div>
